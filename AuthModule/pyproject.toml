[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "1.2.0"
description = "Enterprise AI Security & Governance SDK — Authentication, Authorization, GuardRails, Zero-Retention LLM Proxy, Audit Trail"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Enterprise AI Security Team" }]
keywords = ["ai", "security", "llm", "governance", "guardrails", "owasp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Auth
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",
    "pyotp>=2.9.0",
    "passlib[bcrypt]>=1.7.4",

    # Google Cloud
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-iam>=2.14.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-logging>=3.9.0",
    "google-api-python-client>=2.120.0",

    # HTTP / TLS
    "httpx[http2]>=0.27.0",
    "aiohttp>=3.9.0",
    "certifi>=2024.2.2",

    # PII Detection
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.4",

    # Guardrails / Toxicity
    "detoxify>=0.5.2",
    "better-profanity>=0.7.0",
    "regex>=2024.4.16",

    # Rate Limiting
    "redis>=5.0.3",
    "limits>=3.12.0",

    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-httpx>=0.45b0",

    # Serialization / Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.1",

    # Hashing / Signing
    "argon2-cffi>=23.1.0",

    # Async
    "anyio>=4.3.0",
    "asyncio-throttle>=1.0.2",

    # Logging
    "structlog>=24.1.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.1",
    "factory-boy>=3.3.0",
    "respx>=0.21.1",
    "freezegun>=1.4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "bandit[toml]>=1.7.8",
    "safety>=3.1.0",
]
pentest = [
    "scapy>=2.5.0",
    "parameterized>=0.9.0",
]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",
    "httpx>=0.27.0",
]
docker = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",
    "httpx>=0.27.0",
]
all = [
    "aegis-ai[dev,server,pentest]",
]

[project.scripts]
aegis-server = "aegis_ai.server:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "pentest: marks penetration tests",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I", "S", "B", "A", "C4", "UP"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.coverage.run]
source = ["aegis_ai"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
